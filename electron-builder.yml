appId: com.protech.repair-manager
productName: ProTech Services Repair Manager
directories:
  output: release
files:
  - out/**
  - package.json
  - "!**/*.map"
asar: true
npmRebuild: true

# Auto-update feed (electron-updater reads app-update.yml generated from this).
# CHANGE ME to your update server. Runtime override: UPDATE_FEED_URL env var
# (no rebuild needed). Upload release/latest.yml + the installer .exe there.
publish:
  provider: generic
  url: https://updates.protech.example.com/

win:
  target:
    - nsis
    - portable
  # 512x512 PNG is converted to a multi-size .ico by electron-builder.
  # Regenerate with: npx electron scripts/generate-icon.mjs
  icon: build/icon.png

nsis:
  oneClick: false
  allowToChangeInstallationDirectory: true
  createDesktopShortcut: always
  shortcutName: ProTech Services
  deleteAppDataOnUninstall: false

portable:
  artifactName: ${productName}-portable-${version}.exe

# Code signing is a separate, user-owned step (requires a purchased cert).
