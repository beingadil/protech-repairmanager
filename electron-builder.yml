appId: com.protech.repair-manager
productName: ProTech Services Repair Manager
directories:
  output: release
files:
  - out/**
  - package.json
  - "!**/*.map"
asar: true
npmRebuild: true
# better-sqlite3 ships a native .node addon — must live outside the asar.
asarUnpack:
  - "node_modules/better-sqlite3/**"

# Auto-update feed (electron-updater reads app-update.yml generated from this).
# GitHub Releases provider: pushes latest.yml + installers to a release when
# built with `--publish always` (see .github/workflows/release.yml). Runtime
# override: UPDATE_FEED_URL env var (no rebuild needed).
publish:
  provider: github
  owner: beingadil
  repo: protech-repairmanager
  releaseType: release

win:
  target:
    - nsis
  # 512x512 PNG is converted to a multi-size .ico by electron-builder.
  # Regenerate with: npx electron scripts/generate-icon.mjs
  icon: build/icon.png

nsis:
  oneClick: false
  allowToChangeInstallationDirectory: true
  createDesktopShortcut: always
  shortcutName: ProTech Services
  deleteAppDataOnUninstall: false
  artifactName: ProTechRepairManager-Setup-${version}.exe

# Code signing is a separate, user-owned step (requires a purchased cert).