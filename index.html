      // Simple mock: return mock data for known tables
      const tableMatch = sql.match(/FROMs+(w+)/i);
      if (!tableMatch) return [];
      const table = tableMatch[1].toLowerCase();
      const rows = _mockTables[table] || [];
      // Simple filtering for COUNT
      if (sql.includes('COUNT(*)')) {
        return [{ count: rows.length, total_jobs: rows.length, active_jobs: 1, delivered_jobs: 1, revenue_total: 3500, today_jobs: 1, total_credit: 3500, total_debit: 5000, net_balance: -1500, today_credit: 0, today_debit: 0, total_entries: 2, total_parts: 3, low_stock: 1, out_of_stock: 0, total_val: 15300, laptop_jobs: 2, pc_jobs: 1, avg_charge: 2333 }];

        if (sql.includes('total_jobs')) result.total_jobs = 3;
        if (sql.includes('avg_charge')) result.avg_charge = 2333;
