<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>ProTech App Icon</title>
  <style>
    body { font-family: 'Segoe UI', system-ui, sans-serif; background: #0f172a; color: #e2e8f0;
           display: flex; flex-direction: column; align-items: center; gap: 24px; padding: 32px; margin: 0; }
    h1 { font-size: 16px; font-weight: 600; letter-spacing: .5px; color: #94a3b8; text-transform: uppercase; margin: 0; }
    .row { display: flex; align-items: center; gap: 28px; flex-wrap: wrap; justify-content: center; }
    .cell { text-align: center; }
    .cell span { display: block; font-size: 11px; color: #64748b; margin-top: 6px; font-family: monospace; }
    .tile { background: radial-gradient(circle at 30% 20%, #1e293b, #020617); border-radius: 16px; padding: 24px; display: flex; align-items: center; justify-content: center; }
  </style>
</head>
<body>
  <h1>ProTech Services — App Icon (from build/icon.svg)</h1>
  <div class="row">
    <div class="cell"><div class="tile"><img src="icon.png" width="128" height="128" alt="128px" /></div><span>128 px</span></div>
    <div class="cell"><div class="tile"><img src="icon.png" width="64" height="64" alt="64px" /></div><span>64 px</span></div>
    <div class="cell"><div class="tile"><img src="icon.png" width="48" height="48" alt="48px" /></div><span>48 px</span></div>
    <div class="cell"><div class="tile"><img src="icon.png" width="32" height="32" alt="32px" /></div><span>32 px (taskbar)</span></div>
    <div class="cell"><div class="tile"><img src="icon.png" width="16" height="16" alt="16px" /></div><span>16 px</span></div>
  </div>
  <div class="cell"><div class="tile"><img src="icon.png" width="256" height="256" alt="256px" /></div><span>256 px — installer / desktop</span></div>
</body>
</html>
