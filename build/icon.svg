<svg xmlns="http://www.w3.org/2000/svg" width="512" height="512" viewBox="0 0 512 512">
  <defs>
    <!-- Tile background: executive royal -> navy gradient -->
    <linearGradient id="tileBg" x1="256" y1="0" x2="256" y2="512" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#2f7bf5" />
      <stop offset="45%" stop-color="#144fb8" />
      <stop offset="100%" stop-color="#081f4d" />
    </linearGradient>

    <!-- Soft top-left sheen -->
    <radialGradient id="tileSheen" cx="30%" cy="18%" r="75%" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.28" />
      <stop offset="60%" stop-color="#ffffff" stop-opacity="0.05" />
      <stop offset="100%" stop-color="#ffffff" stop-opacity="0" />
    </radialGradient>

    <!-- Metallic Blue Shield Gradient -->
    <linearGradient id="protechShieldBg" x1="50" y1="5" x2="50" y2="105" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#2b74e8" />
      <stop offset="45%" stop-color="#144fa8" />
      <stop offset="100%" stop-color="#082b68" />
    </linearGradient>

    <!-- Metallic Silver Frame Gradient -->
    <linearGradient id="protechSilverBorder" x1="0" y1="0" x2="100" y2="110" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#ffffff" />
      <stop offset="30%" stop-color="#d1d5db" />
      <stop offset="70%" stop-color="#9ca3af" />
      <stop offset="100%" stop-color="#f3f4f6" />
    </linearGradient>

    <!-- Lock Emblem Silver Glow/Gradient -->
    <linearGradient id="protechLockSilver" x1="20" y1="20" x2="80" y2="90" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#ffffff" />
      <stop offset="50%" stop-color="#e5e7eb" />
      <stop offset="100%" stop-color="#cbd5e1" />
    </linearGradient>

    <!-- Subtle Drop Shadow for the shield -->
    <filter id="shieldShadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="6" stdDeviation="10" flood-color="#000000" flood-opacity="0.45" />
    </filter>
  </defs>

  <!-- Rounded tile background (Windows-style squircle) -->
  <rect x="0" y="0" width="512" height="512" rx="112" fill="url(#tileBg)" />
  <rect x="0" y="0" width="512" height="512" rx="112" fill="url(#tileSheen)" />

  <!-- Thin inner ring -->
  <rect x="10" y="10" width="492" height="492" rx="104" fill="none" stroke="#ffffff" stroke-opacity="0.22" stroke-width="3" />

  <!-- Shield emblem, centered (original viewBox 100x110, scaled 2.8x) -->
  <g transform="translate(116, 100) scale(2.8)">
    <!-- Main Outer Shield Path -->
    <path
      d="M 50 6 C 78 6, 92 14, 92 48 C 92 76, 70 94, 50 104 C 30 94, 8 76, 8 48 C 8 14, 22 6, 50 6 Z"
      fill="url(#protechShieldBg)"
      stroke="url(#protechSilverBorder)"
      stroke-width="4"
      stroke-linejoin="round"
      filter="url(#shieldShadow)"
    />

    <!-- Inner Metallic Border Line -->
    <path
      d="M 50 10 C 74 10, 87 17, 87 48 C 87 72, 67 89, 50 98 C 33 89, 13 72, 13 48 C 13 17, 26 10, 50 10 Z"
      fill="none"
      stroke="#ffffff"
      stroke-opacity="0.25"
      stroke-width="1.2"
    />

    <!-- Lock Shackle (Top Arc) -->
    <path
      d="M 34,44 V 31 C 34,20 66,20 66,31 V 44"
      fill="none"
      stroke="url(#protechLockSilver)"
      stroke-width="5.5"
      stroke-linecap="round"
    />

    <!-- Main Circuit Lock Body Outer Frame -->
    <path
      d="M 30,44 H 70 V 62 C 70 73, 50 83, 50 83 C 50 83, 30 73, 30 62 Z"
      fill="none"
      stroke="url(#protechLockSilver)"
      stroke-width="5"
      stroke-linejoin="round"
      stroke-linecap="round"
    />

    <!-- Circuit Nodes & Lines inside Lock Body -->
    <path
      d="M 42 52 V 67 M 42 59 H 52"
      fill="none"
      stroke="url(#protechLockSilver)"
      stroke-width="3"
      stroke-linecap="round"
    />
    <circle cx="42" cy="52" r="3.2" fill="url(#protechLockSilver)" />
    <circle cx="42" cy="67" r="3.2" fill="url(#protechLockSilver)" />
    <circle cx="52" cy="59" r="3.2" fill="url(#protechLockSilver)" />

    <!-- Right Bottom Curved Node Trace -->
    <path
      d="M 45 77 C 50 77, 58 74, 58 67"
      fill="none"
      stroke="url(#protechLockSilver)"
      stroke-width="3"
      stroke-linecap="round"
    />
    <circle cx="58" cy="67" r="3.2" fill="url(#protechLockSilver)" />
  </g>
</svg>
